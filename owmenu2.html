<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OW Tactics Hub V5</title>
    <style>
        :root { 
            --bg: #121212; --card: #1e1e1e; --accent: #f99e1a; --text: #eee; 
            --tank: #00a1ff; --damage: #ef4444; --support: #fbbf24;
        }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; }
        .view { display: none; width: 100%; max-width: 800px; margin: auto; }
        .active { display: block; }

        /* Сетка и контейнеры */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 15px; margin-top: 15px; }
        .rel-item-container { display: flex; flex-direction: column; gap: 5px; }

        /* Иконки-ячейки */
        .hero-btn { 
            position: relative; aspect-ratio: 1/1;
            background: var(--card); border: 3px solid #333; 
            border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 10px; transition: 0.2s; cursor: pointer; text-align: center;
        }
        .hero-btn.tank { border-color: var(--tank); }
        .hero-btn.damage { border-color: var(--damage); }
        .hero-btn.support { border-color: var(--support); }
        
        /* Кнопки управления на иконках */
        .btn-icon { position: absolute; border: none; border-radius: 50%; width: 22px; height: 22px; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; z-index: 10; border: 1px solid rgba(255,255,255,0.2); }
        .del-rel { top: -8px; right: -8px; background: #ff4444; }
        .note-toggle { bottom: -8px; right: -8px; background: var(--accent); color: black; }

        /* Поле заметки ПОД иконкой */
        .rel-external-note { 
            width: 100%; background: #2a2a2a; border-radius: 6px; border: 1px solid #444;
            display: none; padding: 5px; box-sizing: border-box;
        }
        .rel-external-note.show { display: block; }
        .rel-external-note textarea { 
            background: transparent; border: none; color: #ccc; font-size: 11px; 
            width: 100%; height: 50px; resize: none; outline: none; padding: 0; font-family: inherit;
        }

        /* Интерфейс */
        .filter-row { display: flex; gap: 5px; margin: 10px 0; overflow-x: auto; padding-bottom: 5px; }
        .f-btn { padding: 8px 12px; border: 1px solid #444; background: #222; color: white; border-radius: 20px; font-size: 11px; white-space: nowrap; cursor: pointer; }
        .f-btn.active { background: white; color: black; border-color: white; }

        .btn { padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-main { background: var(--accent); color: black; }
        .btn-sec { background: #444; color: white; }
        
        input, select { width: 100%; padding: 10px; background: #2a2a2a; color: white; border: 1px solid #444; border-radius: 6px; box-sizing: border-box; }
        .stat-item { background: #222; padding: 10px; border-radius: 8px; margin-bottom: 5px; display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>

    <div id="main-menu" class="view active">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="margin:0">Overwatch DB</h2>
            <div style="display:flex; gap:5px;">
                <button class="btn btn-sec" onclick="openMatches()">📝 Анкеты</button>
                <button class="btn btn-sec" onclick="openStats()">📊 Менеджер</button>
            </div>
        </div>

        <div class="filter-row">
            <button class="f-btn active" onclick="setMainFilter('all', this)">Все</button>
            <button class="f-btn" onclick="setMainFilter('tank', this)">Танки</button>
            <button class="f-btn" onclick="setMainFilter('damage', this)">Урон</button>
            <button class="f-btn" onclick="setMainFilter('support', this)">Саппорты</button>
        </div>

        <div style="display: flex; gap: 5px;">
            <button id="mode-c" class="btn btn-main" style="flex:1" onclick="setMode('counters')">КОНТРПИКИ</button>
            <button id="mode-s" class="btn btn-main" style="flex:1; opacity:0.5" onclick="setMode('synergy')">СИНЕРГИЯ</button>
            <button id="mode-w" class="btn btn-main" style="flex:1; opacity:0.5" onclick="setMode('winrate')">СтатВинрейт</button>
        </div>
        
        <!-- Панель фильтрации статистики по режимам игры -->
        <div id="game-mode-filter-row" class="filter-row" style="display:none; margin-top:10px;"></div>

		<div id="sort-controls" style="display:flex; gap:5px; flex-wrap:wrap; margin-top:15px; justify-content:center;"></div>
        <div class="grid" id="hero-grid"></div>

        <div style="margin-top: 25px; background: var(--card); padding: 15px; border-radius: 12px; border: 1px dashed #444;">
            <input type="text" id="new-name" placeholder="Имя героя...">
            <div style="display: flex; gap: 5px; margin-top: 8px;">
                <select id="new-role" style="flex:2">
                    <option value="tank">Танк</option>
                    <option value="damage" selected>Урон</option>
                    <option value="support">Саппорт</option>
                </select>
                <button class="btn btn-main" style="flex:1" onclick="addHero()">+</button>
            </div>
        </div>
    </div>

    <div id="detail-view" class="view">
        <button class="btn btn-sec" onclick="showMain()">← НАЗАД</button>
        <div style="display: flex; align-items: center; gap: 15px; margin: 20px 0 5px 0;">
            <div id="det-img" style="width: 60px; height: 60px; border-radius: 8px; background-size: cover; background-position: center; display: none; border: 2px solid #444;"></div>
            <h1 id="det-title" style="margin: 0">Имя</h1>
        </div>
        
        <div style="background: #222; padding: 12px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 20px;">
            <span>Lvl: <b id="det-lvl-val">0</b></span>
            <span>Hrs: <b id="det-hrs-val">0</b></span>
        </div>

        <div style="background: var(--card); padding: 15px; border-radius: 12px;">
            <label id="rel-label" style="font-weight:bold">Связи:</label>
            <div class="filter-row">
                <button class="f-btn active" onclick="setSelFilter('all', this)">Все</button>
                <button class="f-btn" onclick="setSelFilter('tank', this)">Танки</button>
                <button class="f-btn" onclick="setSelFilter('damage', this)">Урон</button>
                <button class="f-btn" onclick="setSelFilter('support', this)">Саппорты</button>
            </div>
            <select id="rel-selector" onchange="addRel(this.value)"></select>
            
            <div id="rel-grid" class="grid"></div>
        </div>
    </div>

    <div id="stats-view" class="view">
        <button class="btn btn-sec" onclick="showMain()">← НАЗАД</button>
        <div style="display: flex; gap: 8px; margin: 15px 0;">
            <button class="btn btn-main" style="flex:1" onclick="exportJSON()">💾 ЭКСПОРТ</button>
            <button class="btn btn-main" style="flex:1" onclick="document.getElementById('imp').click()">📂 ИМПОРТ</button>
            <input type="file" id="imp" style="display:none" onchange="importJSON(this)">
        </div>
        <div id="stats-list"></div>

        <!-- Раздел управления пулом карт -->
        <div style="margin-top: 25px; background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid #444;">
            <h4 style="margin: 0 0 10px 0; color: var(--accent);">🗺️ Пул карт</h4>
            <div style="display: flex; gap: 5px; margin-bottom: 10px;">
                <input type="text" id="new-map-name" placeholder="Название карты..." style="flex:2;">
                <button class="btn btn-main" style="flex:1;" onclick="addMap()">+ Карта</button>
            </div>
            <div id="maps-list-container" style="display: flex; flex-wrap: wrap; gap: 6px;"></div>
        </div>
    </div>

    <!-- Модальный экран анкет матчей -->
    <div id="matches-view" class="view">
        <button class="btn btn-sec" onclick="showMain()">← НАЗАД</button>
        <h3 style="margin: 15px 0 5px 0;">Анкеты матчей</h3>
        
        <div style="display: flex; gap: 8px; margin-bottom: 15px;">
            <button class="btn btn-main" style="flex:1" onclick="showMatchForm()">➕ Новая анкета</button>
            <button class="btn btn-sec" style="background:#ff4444; color:white;" onclick="clearAllMatches()">🗑️ Очистить все</button>
        </div>

        <div id="match-form-container" style="display:none; background:var(--card); padding:15px; border-radius:12px; margin-bottom:15px; border:1px solid #444;">
            <h4 id="match-form-title" style="margin-top:0">Новая анкета</h4>
            <input type="hidden" id="edit-match-id" value="">
            
            <div style="display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;">
                <div style="flex:1; min-width:110px;">
                    <label style="font-size:11px; font-weight:bold;">Формат:</label>
                    <select id="match-format" onchange="onFormatChange()">
                        <option value="3x3">3x3</option>
                        <option value="5x5" selected>5x5</option>
                        <option value="6x6">6x6</option>
                    </select>
                </div>
                <div style="flex:1; min-width:140px;">
                    <label style="font-size:11px; font-weight:bold;">Результат:</label>
                    <select id="match-loser">
                        <option value="teamB">Проиграла Команда A</option>
                        <option value="teamA">Проиграла Команда B</option>
                    </select>
                </div>
                <div style="flex:1.2; min-width:160px;">
                    <label style="font-size:11px; font-weight:bold;">Режим игры:</label>
                    <select id="match-mode" onchange="updateModeSelectStyle()" style="transition:0.2s; font-weight:bold;">
                        <!-- Заполняется динамически -->
                    </select>
                </div>
                <div style="flex:1.2; min-width:150px;">
                    <label style="font-size:11px; font-weight:bold;">Карта:</label>
                    <select id="match-map">
                        <!-- Заполняется динамически -->
                    </select>
                </div>
            </div>

            <div id="match-teams-container">
                <!-- Динамические поля Команды A и Команды B -->
            </div>

            <div style="display:flex; gap:8px; margin-top:12px;">
                <button class="btn btn-main" style="flex:1" onclick="saveMatch()">Сохранить анкету</button>
                <button class="btn btn-sec" onclick="hideMatchForm()">Отмена</button>
            </div>
        </div>

        <div id="matches-list"></div>
    </div>

    <script>
	let currentSort = 'name'; // Критерий: 'name', 'hours' или 'lvl'

        function setSort(type) {
            currentSort = type;
            renderGrid();
        }
        let db = JSON.parse(localStorage.getItem('ow_ultra_v5')) || {};
        if (!db.matches) db.matches = [];
        if (!db.maps) db.maps = ['Кингс Роу', 'Дорадо', 'Шамбала', 'Нумбани', 'Гибралтар'];
        let currentMode = 'counters';
        let mainFilter = 'all';
        let selFilter = 'all';
        let activeHero = null;
        let selectedGameModeFilter = 'all'; // Фильтр статистики по режиму

        // Карта режимов игры и их фирменных цветов
        const GAME_MODES = {
            'all': { name: 'Общая', color: '#c2cbeb' },
            'quick': { name: 'Нерейтинговый быстрый', color: '#115bff' },
            'comp': { name: 'Соревновательный', color: '#d81654' },
            'stadium': { name: 'Стадион', color: '#ff7606' },
            'comp_stadium': { name: 'Соревновательный стадион', color: '#e33a02' },
            'arcade': { name: 'Аркада', color: '#02dd02' },
            'no_limits': { name: 'Без ограничений', color: '#027ecf' },
            'custom': { name: 'Своя игра', color: '#9119b6' },
            'ai': { name: 'Против ИИ', color: '#ffc402' }
        };

        // Обновление стиля выпадающего списка выбора режима в форме
        function updateModeSelectStyle() {
            const select = document.getElementById('match-mode');
            if (!select) return;
            const modeKey = select.value;
            const modeData = GAME_MODES[modeKey] || GAME_MODES['quick'];
            
            select.style.borderColor = modeData.color;
            select.style.color = modeData.color;
            select.style.background = '#1e1e1e';
        }

        // Заполнение селекта режимов вариантами с подсветкой опций
        function populateModeSelect() {
            const select = document.getElementById('match-mode');
            if (!select) return;
            select.innerHTML = '';
            
            Object.keys(GAME_MODES).forEach(key => {
                if (key === 'all') return; // Для конкретной анкеты "Общая" не выбирается
                const m = GAME_MODES[key];
                select.innerHTML += `<option value="${key}" style="color:${m.color}; background:#222; font-weight:bold;">${m.name}</option>`;
            });
            updateModeSelectStyle();
        }

        // Заполнение селекта карт
        function populateMapSelect() {
            const select = document.getElementById('match-map');
            if (!select) return;
            select.innerHTML = '<option value="">-- Без карты --</option>';
            (db.maps || []).slice().sort().forEach(mapName => {
                select.innerHTML += `<option value="${mapName}">${mapName}</option>`;
            });
        }

        // Управление картами
        function addMap() {
            const input = document.getElementById('new-map-name');
            const name = input ? input.value.trim() : '';
            if (name && !db.maps.includes(name)) {
                db.maps.push(name);
                save();
                input.value = '';
                renderMapsList();
            }
        }

        function deleteMap(mapName) {
            if (confirm(`Удалить карту "${mapName}" из пула?`)) {
                db.maps = db.maps.filter(m => m !== mapName);
                save();
                renderMapsList();
            }
        }

        function renderMapsList() {
            const container = document.getElementById('maps-list-container');
            if (!container) return;
            container.innerHTML = '';
            
            if (!db.maps || db.maps.length === 0) {
                container.innerHTML = '<span style="font-size:12px; color:#888;">Пул карт пуст</span>';
                return;
            }

            db.maps.slice().sort().forEach(mapName => {
                container.innerHTML += `
                    <div style="background:#2a2a2a; padding:4px 8px; border-radius:15px; font-size:11px; display:flex; align-items:center; gap:6px; border:1px solid #444;">
                        <span>${mapName}</span>
                        <span onclick="deleteMap('${mapName}')" style="color:#ef4444; cursor:pointer; font-weight:bold;">✕</span>
                    </div>
                `;
            });
        }

        // Рендер кнопок-фильтров режимов игры для главного экрана
        function renderGameModeFilterRow() {
            const row = document.getElementById('game-mode-filter-row');
            if (!row) return;
            row.innerHTML = '';
            
            Object.keys(GAME_MODES).forEach(key => {
                const m = GAME_MODES[key];
                const isActive = selectedGameModeFilter === key;
                const btn = document.createElement('button');
                btn.className = `f-btn ${isActive ? 'active' : ''}`;
                btn.innerText = m.name;
                btn.style.borderColor = m.color;
                if (isActive) {
                    btn.style.background = m.color;
                    btn.style.color = '#000';
                    btn.style.fontWeight = 'bold';
                } else {
                    btn.style.color = m.color;
                    btn.style.background = '#222';
                }
                btn.onclick = () => {
                    selectedGameModeFilter = key;
                    renderGameModeFilterRow();
                    renderGrid();
                };
                row.appendChild(btn);
            });
        }

        function save() { localStorage.setItem('ow_ultra_v5', JSON.stringify(db)); }

        // Добавление героя
        function addHero() {
            const name = document.getElementById('new-name').value.trim();
            const role = document.getElementById('new-role').value;
            if (name && !db[name]) {
                db[name] = { role, hours: 0, lvl: 0, counters: [], synergy: [] };
                save();
                document.getElementById('new-name').value = "";
                renderGrid();
            }
        }

        // Рендер главного меню
        function renderGrid() {
    const grid = document.getElementById('hero-grid');
    const sortContainer = document.getElementById('sort-controls');
    if (!grid || !sortContainer) return;

    sortContainer.innerHTML = `
        <button class="f-btn ${currentSort === 'name' ? 'active' : ''}" onclick="setSort('name')">А-Я</button>
        <button class="f-btn ${currentSort === 'winrate_asc' ? 'active' : ''}" onclick="setSort('winrate_asc')">Винрейт ↓</button>
        <button class="f-btn ${currentSort === 'winrate_desc' ? 'active' : ''}" onclick="setSort('winrate_desc')">Винрейт ↑</button>
        <button class="f-btn ${currentSort === 'hours' ? 'active' : ''}" onclick="setSort('hours')">По часам</button>
        <button class="f-btn ${currentSort === 'lvl' ? 'active' : ''}" onclick="setSort('lvl')">По уровню</button>
    `;

    grid.innerHTML = '';

    // Вспомогательная функция для получения ТОЛЬКО имен героев без служебных массивов
    window.getHeroNames = function() {
        return Object.keys(db).filter(k => k !== 'matches' && k !== 'maps').sort();
    };

    let sorted = getHeroNames();
    
    if (currentSort === 'name') {
        sorted.sort();
    } else if (currentSort === 'winrate_asc') {
        sorted.sort((a, b) => getHeroWinrateNum(a) - getHeroWinrateNum(b));
    } else if (currentSort === 'winrate_desc') {
        sorted.sort((a, b) => getHeroWinrateNum(b) - getHeroWinrateNum(a));
    } else {
        sorted.sort((a, b) => (db[b][currentSort] || 0) - (db[a][currentSort] || 0));
    }

    sorted.forEach(name => {
        const h = db[name];
        if (!h || typeof h !== 'object') return;
        if (mainFilter !== 'all' && h.role !== mainFilter) return;
        
        const div = document.createElement('div');
        div.className = `hero-btn ${h.role}`;
        div.style.overflow = 'hidden';
        const imgHtml = h.img ? `<img src="${h.img}" loading="lazy" style="position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; opacity:0.4; z-index:1;">` : '';
        
        const subLabel = (currentMode === 'winrate') 
            ? `${getHeroWinrateText(name)}` 
            : `Lvl: ${h.lvl}`;

        div.innerHTML = `
            ${imgHtml}
            <b style="position:relative; z-index:2; text-shadow:1px 1px 2px #000;">${name}</b>
            <span style="font-size:10px; opacity:0.7; margin-top:5px; position:relative; z-index:2; text-shadow:1px 1px 2px #000;">${subLabel}</span>
        `;
        div.onclick = () => openHero(name);
        grid.appendChild(div);
    });
}

        // Открытие карточки
        function openHero(name) {
    activeHero = name;
    selFilter = 'all';
    const h = db[name];
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('detail-view').classList.add('active');
    
    document.getElementById('det-title').innerText = name;
    document.getElementById('det-title').style.color = `var(--${h.role})`;
    
    const detImg = document.getElementById('det-img');
    if (h.img) {
        detImg.style.backgroundImage = `url(${h.img})`;
        detImg.style.display = 'block';
    } else {
        detImg.style.display = 'none';
    }
    
    document.getElementById('det-lvl-val').innerText = h.lvl || 0;
    document.getElementById('det-hrs-val').innerText = h.hours || 0;
    
    // Устанавливаем правильный текст заголовка при открытии
    const label = document.getElementById('rel-label');
    label.innerText = currentMode === 'counters' ? 'Кем контрить:' : 'С кем лучше взаимодействия:';

    document.querySelectorAll('#detail-view .f-btn').forEach(b => {
        b.classList.toggle('active', b.innerText === 'Все');
    });

    updateSelector();
    renderRels();
}

        // Рендер связей (контрпики/синергия)
        function renderRels() {
    const grid = document.getElementById('rel-grid');
    if (!grid) return;
    grid.innerHTML = '';
    
    // Создаем копию массива связей для сортировки, чтобы не менять порядок в базе навсегда
    const rels = [...db[activeHero][currentMode]];

    // СОРТИРОВКА: вычисляем вес каждого контрпика/синергии
    rels.sort((a, b) => {
        const hA = db[a.name] || {lvl: 0, hours: 0};
        const hB = db[b.name] || {lvl: 0, hours: 0};
        return (hB.lvl + hB.hours) - (hA.lvl + hA.hours);
    });

    rels.forEach((item) => {
        const targetName = item.name;
        const targetHero = db[targetName];
        if(!targetHero) return;

        // Фильтр по ролям
        if (selFilter !== 'all' && targetHero.role !== selFilter) return;

        // Находим оригинальный индекс для удаления (так как массив отсортирован)
        const originalIndex = db[activeHero][currentMode].indexOf(item);
        const note = item.note || "";
        const container = document.createElement('div');
        container.className = 'rel-item-container';

        const imgHtml = targetHero.img ? `<img src="${targetHero.img}" style="position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; opacity:0.4; z-index:1;">` : '';
        container.innerHTML = `
            <div class="hero-btn ${targetHero.role}" onclick="openHero('${targetName}')" style="overflow:hidden;">
                ${imgHtml}
                <b style="position:relative; z-index:2; text-shadow:1px 1px 2px #000;">${targetName}</b>
                <div style="font-size:9px; opacity:0.8; margin-top:4px; position:relative; z-index:2; text-shadow:1px 1px 2px #000;">${targetHero.lvl} L / ${targetHero.hours} H</div>
                <button class="btn-icon del-rel" onclick="event.stopPropagation(); removeRel(${originalIndex})">✕</button>
                <button class="btn-icon note-toggle" onclick="event.stopPropagation(); toggleNoteEdit(${originalIndex})">📝</button>
            </div>
            <div id="note-box-${originalIndex}" class="rel-external-note ${note ? 'show' : ''}" onclick="event.stopPropagation()">
                <textarea oninput="saveRelNote(${originalIndex}, this.value)" placeholder="Заметка...">${note}</textarea>
            </div>
        `;
        grid.appendChild(container);
    });
}

        function toggleNoteEdit(idx) {
            const box = document.getElementById(`note-box-${idx}`);
            if (box) box.classList.toggle('show');
        }

        function saveRelNote(idx, text) {
            db[activeHero][currentMode][idx].note = text;
            save();
        }

        function removeRel(idx) {
            db[activeHero][currentMode].splice(idx, 1);
            save();
            renderRels();
        }

        function updateSelector() {
    const sel = document.getElementById('rel-selector');
    if (!sel) return;
    sel.innerHTML = '<option value="">+ Добавить персонажа...</option>';
    
    // Используем getHeroNames(), чтобы исключить matches и maps

        // --- Расчет многофакторного винрейта на основе пропорционального разделения статов ---
        function getHeroWinrateStats(heroName) {
            let matches = db.matches || [];
            let weightedWins = 0;
            let totalWeight = 0;
            let totalWeightedPerfScore = 0;

            matches.forEach(m => {
                if (selectedGameModeFilter !== 'all' && m.mode !== selectedGameModeFilter) {
                    return;
                }

                let allPlayers = [];
                if (m.teamA) allPlayers = allPlayers.concat(m.teamA);
                if (m.teamB) allPlayers = allPlayers.concat(m.teamB);

                allPlayers.forEach(player => {
                    if (!player) return;

                    // Совместимость с со старой и новой структурой данных
                    const heroes = player.heroes || (Array.isArray(player) ? player : [player]);
                    const stats = player.stats || player;
                    const isWin = player.isWin !== undefined ? player.isWin : (heroes[0] ? heroes[0].isWin : false);

                    // Считаем общее время игрока в секундах
                    let totalPlayerSeconds = 0;
                    heroes.forEach(h => {
                        const sec = h.seconds || parseTimeToSeconds(h.timeStr || h.minutes);
                        totalPlayerSeconds += (sec > 0 ? sec : 300); // По умолчанию 5 мин если не указано
                    });

                    heroes.forEach(h => {
                        if (h && h.name === heroName) {
                            const heroSec = h.seconds || parseTimeToSeconds(h.timeStr || h.minutes) || (totalPlayerSeconds / heroes.length);
                            const heroMinutes = Math.max(0.5, heroSec / 60);

                            // Доля времени данного героя от общего времени игрока
                            const ratio = totalPlayerSeconds > 0 ? (heroSec / totalPlayerSeconds) : (1 / heroes.length);

                            // Пропорциональные показатели персонажа
                            const k = (stats.k || 0) * ratio;
                            const a = (stats.a || 0) * ratio;
                            const d = (stats.d || 0) * ratio;
                            const dmg = (stats.dmg || 0) * ratio;
                            const heal = (stats.heal || 0) * ratio;
                            const mit = (stats.mit || 0) * ratio;

                            // Вес матча для статистики герою
                            const weight = Math.min(1, heroMinutes / 10);
                            
                            totalWeight += weight;
                            if (isWin) weightedWins += weight;

                            // Расчет удельного импакта
                            const kda = (k + a) / Math.max(1, d);
                            const impactPerMin = (dmg + heal + mit) / heroMinutes;

                            const matchPerfPerMin = (kda * 8) + (impactPerMin / 65);
                            totalWeightedPerfScore += (matchPerfPerMin * weight);
                        }
                    });
                });
            });

            if (totalWeight === 0) return { wins: 0, total: 0, pct: 0 };

            const baseWinrate = (weightedWins / totalWeight) * 100;
            const avgPerf = totalWeightedPerfScore / totalWeight;
            
            let adjustedWinrate = (0.55 * baseWinrate) + (0.45 * Math.min(100, avgPerf));
            adjustedWinrate = Math.max(0, Math.min(100, adjustedWinrate));

            return { wins: weightedWins, total: totalWeight, pct: adjustedWinrate };
        }

        // Вспомогательная функция перевода MM:SS в секунды
        function parseTimeToSeconds(timeStr) {
            if (!timeStr) return 0;
            const str = String(timeStr).trim();
            if (str.includes(':')) {
                const parts = str.split(':');
                const m = parseInt(parts[0]) || 0;
                const s = parseInt(parts[1]) || 0;
                return (m * 60) + s;
            }
            const val = parseFloat(str) || 0;
            // Если ввели просто число, считаем, что это минуты
            return Math.round(val * 60);
        }

        // Перевод секунд обратно в формат MM:SS
        function formatSecondsToMMSS(seconds) {
            const sec = Math.max(0, Math.round(seconds));
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function saveMatch() {
            const editId = document.getElementById('edit-match-id').value;
            const format = document.getElementById('match-format').value;
            const loserTeam = document.getElementById('match-loser').value;
            const mode = document.getElementById('match-mode').value;
            const map = document.getElementById('match-map').value;
            const playerCount = getPlayersCountByFormat(format);

            const readTeamPlayers = (teamTag, isWin) => {
                const players = [];
                for (let pIdx = 0; pIdx < playerCount; pIdx++) {
                    const heroes = [];
                    for (let hIdx = 0; hIdx < 3; hIdx++) {
                        const hName = document.getElementById(`m-${teamTag}-p${pIdx}-h${hIdx}-name`).value;
                        const timeStr = document.getElementById(`m-${teamTag}-p${pIdx}-h${hIdx}-time`).value;
                        if (hName) {
                            heroes.push({
                                name: hName,
                                timeStr: timeStr,
                                seconds: parseTimeToSeconds(timeStr)
                            });
                        }
                    }

                    // Считываем единые 6 показателей игрока
                    const stats = {
                        k: parseInt(document.getElementById(`m-${teamTag}-p${pIdx}-k`).value) || 0,
                        a: parseInt(document.getElementById(`m-${teamTag}-p${pIdx}-a`).value) || 0,
                        d: parseInt(document.getElementById(`m-${teamTag}-p${pIdx}-d`).value) || 0,
                        dmg: parseInt(document.getElementById(`m-${teamTag}-p${pIdx}-dmg`).value) || 0,
                        heal: parseInt(document.getElementById(`m-${teamTag}-p${pIdx}-heal`).value) || 0,
                        mit: parseInt(document.getElementById(`m-${teamTag}-p${pIdx}-mit`).value) || 0
                    };

                    if (heroes.length > 0) {
                        players.push({
                            isWin: isWin,
                            heroes: heroes,
                            stats: stats
                        });
                    }
                }
                return players;
            };

            const teamA = readTeamPlayers('A', loserTeam !== 'teamA');
            const teamB = readTeamPlayers('B', loserTeam !== 'teamB');

            if (teamA.length === 0 && teamB.length === 0) {
                alert('Заполните хотя бы одного персонажа!');
                return;
            }

            const matchData = {
                id: editId ? Number(editId) : Date.now(),
                format,
                loserTeam,
                mode,
                map,
                teamA,
                teamB
            };

            if (editId) {
                const idx = db.matches.findIndex(m => m.id == editId);
                if (idx !== -1) db.matches[idx] = matchData;
            } else {
                db.matches.push(matchData);
            }

            save();
            hideMatchForm();
            renderMatchesList();
            renderGrid();
        }

                                <button onclick="showMatchForm(${m.id})" title="Редактировать" style="background:none; border:none; color:#f99e1a; cursor:pointer; font-size:14px;">✏️</button>
                                <button onclick="deleteMatch(${m.id})" title="Удалить" style="background:none; border:none; color:red; cursor:pointer; font-size:14px;">🗑️</button>
                            </div>
                        </div>
                        <div style="margin-top:6px;">
                            <div style="font-size:11px; color:#00a1ff; font-weight:bold;">Команда A:</div>
                            ${renderTeamCards(m.teamA || [])}
                            <div style="font-size:11px; color:#ef4444; font-weight:bold; margin-top:5px;">Команда B:</div>
                            ${renderTeamCards(m.teamB || [])}
                        </div>
                    </div>
                `;
            });
        }

        // Старт
        renderGrid();
		function editName(oldName) {
    const el = document.getElementById(`name-display-${oldName}`);
    const input = document.createElement('input');
    input.value = oldName;
    input.style.width = '80px';
    input.onblur = () => {
        const newName = input.value.trim();
        if (newName && newName !== oldName) {
            db[newName] = db[oldName];
            delete db[oldName];
            save();
            openStats(); // Перерендерим список
        } else {
            el.innerText = oldName;
        }
    };
    el.innerText = '';
    el.appendChild(input);
    input.focus();
}
    </script>
